name: Deploy QueueTrack Tracking Page

on:
  push:
    branches: [Dev]
    paths:
      - 'QueueTrack/docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./QueueTrack/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-netlify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify
        run: |
          FILE="QueueTrack/docs/index.html"
          HASH=$(sha1sum "$FILE" | awk '{print $1}')

          # Create deploy with file digest
          DEPLOY=$(curl -s -X POST "https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"files\": {\"/index.html\": \"$HASH\"}}")
          DEPLOY_ID=$(echo "$DEPLOY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          # Upload file
          curl -s -X PUT "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID/files/index.html" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$FILE"

          echo "Deployed to https://queuetrack.netlify.app"
